# MonkeyCoin Launchpad Frontend + Backend API — HTTP
server {
    listen 80;
    server_name monkeycoin.top www.monkeycoin.top;

    root /www/wwwroot/monkeycoin.top;
    index index.html;
    client_max_body_size 3m;

    # 靓号挖盐 + 自动开源后端代理
    location /snowball-api/ {
        proxy_pass http://127.0.0.1:8797/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|jpg|jpeg|png|gif|svg|webp|woff2?|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
